[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autoimmune-ml"
version = "0.2.0"
description = "Machine-learning classifiers for autoimmune disease diagnosis from RNA-seq expression data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.3",
    "xgboost>=1.7",
    "matplotlib>=3.6",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
notebooks = ["jupyter", "seaborn"]

[project.scripts]
autoimmune-ml = "autoimmune_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
